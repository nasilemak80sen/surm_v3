# ═════════════════════════════════════════════════════════════════
# SURM Toolkit v2.0 — Streamlit Configuration
# Corporate / Enterprise Edition
# ═════════════════════════════════════════════════════════════════


[theme]
base = "light"
primaryColor = "#00a19c"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F8F9FA"
textColor = "#0A0E27"
font = "sans serif"

[client]
toolbarMode = "minimal"
showErrorDetails = true

[server]
port = 8501
headless = true
enableXsrfProtection = true
maxUploadSize = 50
runOnSave = true
fileWatcherType = "auto"

[logger]
level = "info"
messageFormat = "%(asctime)s [%(name)s] %(message)s"

[browser]
gatherUsageStats = false
serverAddress = "localhost"
serverPort = 8501
