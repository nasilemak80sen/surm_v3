# ═════════════════════════════════════════════════════════════════
# SURM Toolkit v2.0 — Streamlit Configuration
# Corporate / Enterprise Edition
# ═════════════════════════════════════════════════════════════════


[theme]
base = "light"
primaryColor = "#006B67"
backgroundColor = "#F7FAF8"
secondaryBackgroundColor = "#EFF4F1"
textColor = "#17332C"
font = "sans serif"
linkColor = "#006B67"
codeTextColor = "#17332C"
codeBackgroundColor = "#EAF1ED"
borderColor = "#D7E2DC"
dataframeBorderColor = "#D7E2DC"
dataframeHeaderBackgroundColor = "#EAF1ED"
chartCategoricalColors = ["#006B67", "#2563EB", "#C77716", "#B54747", "#7656C9", "#547A4B", "#66736D"]
baseRadius = "small"
showWidgetBorder = true
showSidebarBorder = true

[theme.sidebar]
backgroundColor = "#0E2928"
secondaryBackgroundColor = "#153735"
textColor = "#F4FAF6"
primaryColor = "#006B67"

[client]
toolbarMode = "developer"
showErrorDetails = true

[server]
port = 8501
headless = true
enableXsrfProtection = true
maxUploadSize = 50

# SURM is commonly run from synchronized corporate folders. Do not rerun the
# application on every file-system change; that can interrupt a live browser
# session while the working tree or sync client updates files.
runOnSave = false
fileWatcherType = "auto"
folderWatchBlacklist = [".git", ".venv", "__pycache__", ".pytest_cache"]

[logger]
level = "info"
messageFormat = "%(asctime)s [%(name)s] %(message)s"

[browser]
gatherUsageStats = false
serverAddress = "localhost"
serverPort = 8501
