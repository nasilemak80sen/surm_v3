[app]
entry_point = "app.py"

[theme]
base                     = "light"
primaryColor             = "#1F6B3A"
backgroundColor          = "#FFFFFF"
secondaryBackgroundColor = "#F2F2F2"
textColor                = "#1A1A1A"
font                     = "sans serif"

[server]
maxUploadSize    = 50
headless         = true
enableCORS       = false

[browser]
gatherUsageStats = false
