# ═════════════════════════════════════════════════════════════════
# SURM Toolkit v2.0 — Streamlit Configuration
# Corporate/Enterprise Edition
# ═════════════════════════════════════════════════════════════════

[app]
title                   = "SURM Toolkit"
description             = "Subsurface Uncertainty & Risk Management | PETRONAS Carigali"
entry_point             = "surm.py"
showWarningOnDirectExecution = false

[theme]
base                     = "light"  # ✅ FIXED: Was "dark", now matches colors
primaryColor             = "#00a19c"  # PETRONAS Green
backgroundColor          = "#FFFFFF"  # Pure white
secondaryBackgroundColor = "#F8F9FA"  # Light gray
textColor                = "#0A0E27"  # Near-black
font                     = "sans serif"  # ✅ FIXED: Removed space

[client]
toolbarMode              = "minimal"  # Clean UI, user can toggle
showErrorDetails         = true  # Show Python errors (development)
maxMessageSize           = 10  # MB (for large file uploads)

[server]
port                     = 8501
headless                 = true  # Don't open browser automatically
enableCORS               = false  # Secure for internal use
enableXsrfProtection     = true  # ✅ Enabled by default (keep)
maxUploadSize            = 50  # MB
runOnSave                = true  # Reload on file save (development)
fileWatcherType          = "auto"

[logger]
level                    = "info"
messageFormat            = "%(asctime)s [%(name)s] %(message)s"

[session]
sessionTimeout           = 1800  # 30 minutes (seconds)

[browser]
gatherUsageStats         = false  # ✅ FIXED: Disable for privacy
serverAddress            = "localhost"  # Internal only
serverPort               = 8501

# ═════════════════════════════════════════════════════════════════
