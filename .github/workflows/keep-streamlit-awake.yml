name: Keep SURM Awake

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      app_url:
        description: "Optional Streamlit URL override"
        required: false
        type: string
        default: ""

jobs:
  ping:
    name: Ping SURM Streamlit App
    runs-on: ubuntu-latest
    env:
      SURM_APP_URL: ${{ inputs.app_url || vars.SURM_APP_URL }}

    steps:
      - name: Check SURM
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${SURM_APP_URL}" ]; then
            echo "SURM_APP_URL is not configured."
            echo "Set a repository variable named SURM_APP_URL or provide a manual app_url input."
            exit 1
          fi

          case "${SURM_APP_URL}" in
            http://*|https://*) ;;
            *)
              echo "SURM_APP_URL must start with http:// or https://"
              exit 1
              ;;
          esac

          echo "Checking SURM at ${SURM_APP_URL}"
          http_status=$(curl \
            --location \
            --output /dev/null \
            --silent \
            --show-error \
            --write-out "%{http_code}" \
            --max-time 60 \
            "${SURM_APP_URL}")

          echo "HTTP status: ${http_status}"

          if [ "${http_status}" -ge 400 ]; then
            echo "SURM returned HTTP ${http_status}"
            exit 1
          fi

          echo "SURM is reachable."
